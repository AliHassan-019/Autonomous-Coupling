name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: python -m pip install black flake8

      - name: Check syntax
        run: python -m compileall -q src/stewart_control scripts

      - name: Check formatting
        run: |
          black --check --diff \
            src/stewart_control/stewart_control \
            src/stewart_control/test

      - name: Lint
        run: |
          flake8 \
            src/stewart_control/stewart_control \
            src/stewart_control/test \
            --max-line-length=88 \
            --extend-ignore=E203,W503

  ros-build:
    name: ROS 2 build
    runs-on: ubuntu-24.04
    container:
      image: osrf/ros:jazzy-desktop
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install package dependencies
        run: |
          apt-get update
          apt-get install -y python3-numpy python3-yaml

      - name: Build package
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select stewart_control

  arduino:
    name: Arduino firmware
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Install board support and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install PID

      - name: Compile firmware
        run: |
          mkdir -p /tmp/pilotage_feedback_mp
          cp src/stewart_control/arduino/pilotage_feedback_mp.ino \
            /tmp/pilotage_feedback_mp/
          arduino-cli compile \
            --fqbn arduino:avr:mega \
            /tmp/pilotage_feedback_mp
